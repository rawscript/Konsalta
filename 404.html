<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#061a32" />
    <title>Page not found | Konsalta</title>
    <link rel="icon" href="/public/favicon.ico" type="image/x-icon" />
    <style>
      :root {
        color-scheme: light;
        font-family: Manrope, "Segoe UI", sans-serif;
        color: #0b2d53;
        background: #f8f6f0;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px 18px;
        background:
          radial-gradient(ellipse at 82% 16%, #fff0d6 0, transparent 34%),
          linear-gradient(145deg, #fbfaf6, #f0ece1);
      }
      main {
        width: min(100%, 720px);
        padding: clamp(28px, 7vw, 64px);
        text-align: center;
        border: 1px solid #e2ddd3;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 24px 70px rgba(11, 45, 83, 0.1);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 30px;
        color: #0b2d53;
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: 0.02em;
        text-decoration: none;
      }
      .brand img { width: 42px; height: 42px; object-fit: contain; }
      .sun {
        display: grid;
        width: 132px;
        height: 132px;
        place-items: center;
        margin: 0 auto 26px;
        border: 1px solid #f8c5a6;
        border-radius: 50%;
        background: linear-gradient(145deg, #fff2eb, #ffe2cc);
        color: #d34e0d;
      }
      .sun svg { width: 76px; height: 76px; }
      .eyebrow {
        margin: 0 0 10px;
        color: #d34e0d;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3.6rem);
        line-height: 1.08;
        letter-spacing: -0.045em;
      }
      .message {
        max-width: 470px;
        margin: 18px auto 28px;
        color: #4e5e73;
        font-size: 1.05rem;
        line-height: 1.7;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }
      .button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 12px 20px;
        border: 1px solid #f26522;
        border-radius: 999px;
        background: #f26522;
        color: #061a32;
        font-weight: 800;
        text-decoration: none;
        transition: transform 160ms ease, box-shadow 160ms ease;
      }
      .button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px #f2652238; }
      .button.secondary { border-color: #d5dce3; background: #fff; }
      :focus-visible { outline: 3px solid #16487e; outline-offset: 4px; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/">
        <img src="/public/Logo-5.png" alt="" />
        <span>Konsalta</span>
      </a>
      <div class="sun" aria-hidden="true">
        <svg viewBox="0 0 80 80" fill="none">
          <circle cx="40" cy="40" r="15" stroke="currentColor" stroke-width="4" />
          <path d="M40 7v10M40 63v10M7 40h10M63 40h10M16.7 16.7l7.1 7.1m32.4 32.4 7.1 7.1m0-46.6-7.1 7.1M23.8 56.2l-7.1 7.1" stroke="#f26522" stroke-width="4" stroke-linecap="round" />
          <path d="m34 36 6-5v18" stroke="#0b2d53" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <p class="eyebrow">A little off course</p>
      <h1>We can’t find that page.</h1>
      <p class="message">
        The link may have changed, or the page may have taken a different path.
        Let’s get you back to useful ground.
      </p>
      <nav class="actions" aria-label="Helpful links">
        <a class="button" href="/">Back to homepage</a>
        <a class="button secondary" href="/insights.html">Explore our insights</a>
      </nav>
    </main>
  </body>
</html>
